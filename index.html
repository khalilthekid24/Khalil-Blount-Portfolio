<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khalil Blount | Portfolio</title>
<style>
:root{--bg:#1c1d21;--bg2:#26272c;--tile:#2f3036;--ink:#f2f3f5;--mute:#9a9ca5;--ring:#fff;--accent:#e60012;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg));color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,a{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus{outline:none}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px}
.profile{display:flex;align-items:center;gap:10px;text-decoration:none;border-radius:999px;padding:3px 14px 3px 3px;transition:background .2s}
.profile:hover,.profile:focus{background:rgba(255,255,255,.1);box-shadow:0 0 0 2px var(--ring)}
.avatar{object-fit:cover;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#e60012,#ff8a5c);display:grid;place-items:center;font-weight:800;border:2px solid #fff}
.profile span.n{font-weight:700;font-size:.95rem}
.status{display:flex;align-items:center;gap:12px;font-weight:700}
#clock{font-size:1.25rem;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.status svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
main{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
#row{display:flex;gap:18px;overflow-x:auto;padding:34px 8vw;scroll-snap-type:x proximity;scrollbar-width:none}
#row::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;width:clamp(160px,min(36vw,48vh),380px);aspect-ratio:1;border-radius:16px;background:var(--tile);scroll-snap-align:center;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s;text-align:left}
.tile.empty{opacity:.45;pointer-events:none;background:#2a2b30}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .ph{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;font-weight:800;font-size:1.1rem;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.tile:hover,.tile:focus{transform:scale(1.07);box-shadow:0 0 0 4px var(--ring),0 0 28px rgba(255,255,255,.35);z-index:2}
.cap{height:1.6em;text-align:center;font-weight:700;color:var(--ink);margin:0;transition:opacity .2s}
footer{padding:0 0 22px;display:flex;flex-direction:column;align-items:center;gap:8px}
.dock{display:flex;gap:18px;align-items:center;background:rgba(255,255,255,.07);border-radius:999px;padding:12px 26px;backdrop-filter:blur(8px)}
.dk{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;text-decoration:none;background:var(--tile);transition:transform .18s,box-shadow .18s}
.dk svg{width:28px;height:28px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dk:hover,.dk:focus{transform:scale(1.14);box-shadow:0 0 0 3px var(--ring),0 0 22px rgba(255,255,255,.3)}
.dk.lib{background:var(--accent)}
#dl{height:1.4em;font-size:.9rem;font-weight:700;color:var(--mute)}
.layer{position:fixed;inset:0;background:rgba(10,10,12,.78);backdrop-filter:blur(6px);display:none;z-index:10;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto}
.layer.on{display:grid;place-items:start center;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.panel{margin:auto;width:min(560px,100%);background:#2b2c32;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.cover{height:110px;background:#2f3036}.phead{display:flex;align-items:flex-end;gap:16px;padding:0 22px 4px}.pic{width:124px;height:124px;flex:none;object-fit:cover;border-radius:22px;border:4px solid #2b2c32;background:#2b2c32;margin-top:-62px;box-shadow:0 8px 24px rgba(0,0,0,.4)}.pic[hidden]{display:none}.phead h2{margin:0;font-size:1.45rem;line-height:1.15;padding:14px 0 4px}
.body{padding:18px 22px 8px}
.body p{margin:0 0 12px;line-height:1.5;color:#d7d8dd}
.facts{display:grid;gap:8px;margin:0 0 16px}.facts div{display:flex;gap:14px}.facts dt{color:var(--mute);min-width:96px;font-weight:700}.facts dd{margin:0}.body h3{margin:0 0 8px;font-size:1.05rem}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tags span{font-size:.8rem;background:rgba(255,255,255,.1);border-radius:999px;padding:3px 10px}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 22px;text-decoration:none;border-top:1px solid rgba(255,255,255,.08);font-weight:700;transition:background .15s}
.opt:hover,.opt:focus{background:#fff;color:#1c1d21}
.lib-page{width:min(900px,100%);align-self:start}
.lib-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.lib-head h2{margin:0;font-size:1.6rem}
.back{background:var(--tile);border-radius:999px;padding:10px 18px;font-weight:700}
.back:hover,.back:focus{background:#fff;color:#1c1d21}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.game{background:var(--tile);border-radius:14px;overflow:hidden}
.game .art{aspect-ratio:1;display:flex;align-items:flex-end;padding:10px;font-weight:800;background-size:cover;background-position:center}
.game .meta{padding:10px 12px;font-size:.85rem;color:var(--mute)}
.game .meta b{display:block;color:var(--ink);font-size:.95rem}
#slideLayer{z-index:20;background:rgba(6,6,8,.92)}
.viewer{width:min(1200px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;margin:auto}
#sImg{max-width:100%;max-height:calc(100vh - 150px);border-radius:14px;background:#000;cursor:pointer}
.vbar{display:flex;gap:12px;align-items:center;font-weight:700}
.vbar .back{min-width:48px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){header{padding:14px}.profile span.n{display:none}.dock{gap:12px;padding:10px 18px}}
</style>
</head>
<body>
<header>
  <a class="profile" href="about.html" aria-label="About me">
    <img class="avatar" src="images/mii.png" alt=""><span class="n">Khalil Blount</span>
  </a>
  <div class="status">
    <span id="clock" aria-live="off"></span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M21 10v4"/><rect x="4" y="9" width="11" height="6" fill="#5be37d" stroke="none"/></svg>
  </div>
</header>

<main>
  <div id="row" role="list" aria-label="Projects"></div>
  <p class="cap" id="cap"></p>
</main>

<footer>
  <nav class="dock" aria-label="Links">
    <a class="dk" href="https://www.instagram.com/blountcreativeco/" target="_blank" rel="noopener" data-l="Instagram" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".8" fill="currentColor"/></svg></a>
    <a class="dk" href="https://www.linkedin.com/in/khalil-blount/" target="_blank" rel="noopener" data-l="LinkedIn" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10.5V16M8 7.8v.1M12 16v-5.5M12 13c0-1.5 1-2.5 2.3-2.5S16.5 11.5 16.5 13v3"/></svg></a>
    <button class="dk lib" id="libBtn" data-l="Game Library" aria-label="Game Library"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="7" height="14" rx="1.5"/><rect x="12" y="5" width="4" height="14" rx="1"/><path d="M18.5 6.5l3 11.5"/></svg></button>
  </nav>
  <div id="dl"></div>
</footer>

<div class="layer" id="projLayer" role="dialog" aria-modal="true" aria-labelledby="pt">
  <div class="panel">
    <div class="cover" id="pc"></div>
    <div class="phead"><img class="pic" id="pimg" alt="" hidden><h2 id="pt"></h2></div>
    <div class="body"><p id="pd"></p><div class="tags" id="ptags"></div></div>
    <a class="opt" id="pu" href="#" target="_blank" rel="noopener"><span>View project</span><span>&rsaquo;</span></a>
    <button class="opt" id="pclose"><span>Back to home</span><span>B</span></button>
  </div>
</div>

<div class="layer" id="libLayer" role="dialog" aria-modal="true" aria-labelledby="lt">
  <div class="lib-page">
    <div class="lib-head"><h2 id="lt">Recently played</h2><button class="back" id="lclose">Back to home</button></div>
    <div class="games" id="games"></div>
  </div>
</div>

<div class="layer" id="slideLayer" role="dialog" aria-modal="true" aria-label="Project slides">
  <div class="viewer">
    <img id="sImg" alt="">
    <div class="vbar"><button class="back" id="sPrev" aria-label="Previous slide">&lsaquo;</button><span id="sCount"></span><button class="back" id="sNext" aria-label="Next slide">&rsaquo;</button><button class="back" id="sClose">Back</button></div>
  </div>
</div>

<script>
/* ===== EDIT YOUR CONTENT HERE (max 10 projects) ===== */
const PROJECTS=[
 {title:"Cubbie's: Since '85",desc:"",industry:"Restaurant Branding & Marketing Campaign",role:"Art Director",deliverables:"Visual Identity, Digital Ads, Out-of-Home Ads",challenge:["Cubbie’s has long been an ECU and Greenville staple for Southern comfort food, but a recent wave of modern burger joints threatened its hometown dominance. Falling behind the curve due to an outdated 1980s visual identity and a passive marketing strategy, the restaurant needed a modern intervention. I stepped in to spearhead the rebrand.", "First, I overhauled their visual identity… cleaned up the typography and modernized their mascot into a timeless brand asset ready for merchandise, signage, and packaging. Next, I launched the “New Bear in Town” marketing campaign. By cleverly hijacking famous food catchphrases from pop culture’s most iconic bears, the campaign confidently reminds locals and students alike that when it comes to comfort food, Cubbie the Bear still owns the block."],tags:[],url:"#",img:"images/cubbies/cover.jpg",slides:["images/cubbies/01-hero.jpg","images/cubbies/02-mascot.jpg","images/cubbies/03-logo-suite.jpg","images/cubbies/04-primary-logo.jpg","images/cubbies/05-apparel-mural.jpg","images/cubbies/06-billboard.jpg","images/cubbies/07-posters.jpg","images/cubbies/08-social-ads.jpg"],c1:"#e60012",c2:"#7a0010"},
 {title:"Every Rep Basketball",desc:"Project details coming soon.",tags:[],url:"#",img:"",c1:"#f5a300",c2:"#e8571f"},
 {title:"Carolina Safety Supply",desc:"Project details coming soon.",tags:[],url:"#",img:"",c1:"#00a0e9",c2:"#04507a"},
 {title:"Baked by Love",desc:"Project details coming soon.",tags:[],url:"#",img:"",c1:"#d946a8",c2:"#7a2cbf"},
 {title:"Ducks Unlimited: Legacy Gala 2026",desc:"Project details coming soon.",tags:[],url:"#",img:"",c1:"#00b86b",c2:"#065a3a"},
 {title:"Sport/Gameday",desc:"Project details coming soon.",tags:[],url:"#",img:"",c1:"#6f5bff",c2:"#2a1f8f"},
 {title:"Digital Illustration",desc:"Project details coming soon.",tags:[],url:"#",img:"",c1:"#ff8a5c",c2:"#c2362b"},
 {title:"Brand Book",desc:"Project details coming soon.",tags:[],url:"#",img:"",c1:"#0b7a75",c2:"#0a3d4a"}
];
const GAMES=[
 {"title": "The Legend of Zelda: Tears of the Kingdom", "platform": "Switch 2", "time": "72 hrs played", "last": "Last played Tue 9/29", "img": "images/games/zelda.jpg", "c1": "#00a0e9", "c2": "#04507a"},
 {"title": "Yoshi's Island", "platform": "GBA", "time": "9 hrs played", "last": "Last played yesterday", "img": "images/games/yoshi.jpg", "c1": "#00b86b", "c2": "#065a3a"},
 {"title": "Super Metroid", "platform": "SNES", "time": "11 hrs played", "last": "Last played last week", "img": "images/games/metroid.jpg", "c1": "#e60012", "c2": "#7a0010"},
 {"title": "Donkey Kong Country Returns", "platform": "Wii", "time": "", "last": "Last played 2 weeks ago", "img": "images/games/dkcr.jpg", "c1": "#f5a300", "c2": "#8a4a00"}
];
/* ===================================================== */
const $=s=>document.querySelector(s),row=$("#row"),cap=$("#cap");
const bg=o=>o.img?`background-image:url('${o.img}')`:`background-image:linear-gradient(135deg,${o.c1},${o.c2})`;
let opener=null;

PROJECTS.slice(0,10).forEach((p,i)=>{
  const b=document.createElement("button");b.className="tile";b.setAttribute("role","listitem");
  b.dataset.i=i;b.setAttribute("aria-label",p.title);
  b.innerHTML=p.img?`<img src="${p.img}" alt=""><span class="ph"></span>`:`<span class="ph" style="${bg(p)}">${p.title}</span>`;
  b.onfocus=()=>{cap.textContent=p.title;b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})};
  b.onmouseenter=()=>b.focus({preventScroll:true});
  b.onclick=()=>openProj(p,b);
  row.appendChild(b);
});
for(let i=PROJECTS.length;i<10;i++){const e=document.createElement("div");e.className="tile empty";e.setAttribute("aria-hidden","true");row.appendChild(e)}

row.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){row.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});

function openLayer(l,from){opener=from;l.classList.add("on");(l.querySelector(".opt,.back")).focus()}
function closeLayers(){document.querySelectorAll(".layer.on").forEach(l=>l.classList.remove("on"));if(opener)opener.focus();opener=null}
function openProj(p,from){
  $("#pt").textContent=p.title;$("#pd").innerHTML=(p.industry?`<dl class="facts"><div><dt>Industry</dt><dd>${p.industry}</dd></div><div><dt>Role</dt><dd>${p.role}</dd></div><div><dt>Deliverables</dt><dd>${p.deliverables}</dd></div></dl>`:"")+(p.challenge?`<h3>The Challenge</h3>`+p.challenge.map(t=>`<p>${t}</p>`).join(""):`<p>${p.desc}</p>`);
  $("#pc").style.background=p.c1;{const im=$("#pimg");im.hidden=!p.img;if(p.img)im.src=p.img}
  $("#ptags").innerHTML=p.tags.map(t=>`<span>${t}</span>`).join("");
  $("#pu").href=p.slides?"#":p.url;$("#pu").onclick=p.slides?e=>{e.preventDefault();openSlides(p)}:null;openLayer($("#projLayer"),from);
}
let slides=[],si=0,tx=0;
function showSlide(){$("#sImg").src=slides[si];$("#sImg").alt="Slide "+(si+1)+" of "+slides.length;$("#sCount").textContent=(si+1)+" / "+slides.length}
function step(d){si=(si+d+slides.length)%slides.length;showSlide()}
function openSlides(p){slides=p.slides;si=0;showSlide();$("#slideLayer").classList.add("on");$("#sNext").focus()}
function closeSlides(){$("#slideLayer").classList.remove("on");$("#pu").focus()}
$("#sPrev").onclick=()=>step(-1);$("#sNext").onclick=()=>step(1);$("#sClose").onclick=closeSlides;$("#sImg").onclick=()=>step(1);
$("#sImg").addEventListener("touchstart",e=>{tx=e.changedTouches[0].clientX},{passive:true});
$("#sImg").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)step(dx<0?1:-1)});
$("#pclose").onclick=closeLayers;$("#lclose").onclick=closeLayers;
document.querySelectorAll(".layer").forEach(l=>l.addEventListener("click",e=>{if(e.target===l)l.id==="slideLayer"?closeSlides():closeLayers()}));

$("#games").innerHTML=GAMES.map(g=>`<div class="game"><div class="art" style="${bg(g)}" role="img" aria-label="${g.title}">${g.img?"":g.title}</div><div class="meta"><b>${g.title}</b>${g.platform}<br>${[g.time,g.last].filter(Boolean).join(" &middot; ")}</div></div>`).join("");
$("#libBtn").onclick=e=>openLayer($("#libLayer"),e.currentTarget);

document.querySelectorAll(".dk").forEach(d=>{
  const on=()=>$("#dl").textContent=d.dataset.l,off=()=>$("#dl").textContent="";
  d.addEventListener("focus",on);d.addEventListener("mouseenter",on);d.addEventListener("blur",off);d.addEventListener("mouseleave",off);
});

/* Remote-style controls: arrows move, Enter selects, Esc goes back */
document.addEventListener("keydown",e=>{
  if($("#slideLayer").classList.contains("on")){
    if(e.key==="Escape"||e.key==="Backspace"){closeSlides();e.preventDefault()}
    else if(e.key==="ArrowRight"){step(1);e.preventDefault()}
    else if(e.key==="ArrowLeft"){step(-1);e.preventDefault()}
    return}
  if(e.key==="Escape"||e.key==="Backspace"&&document.querySelector(".layer.on")){closeLayers();return}
  if(document.querySelector(".layer.on"))return;
  const tiles=[...row.querySelectorAll("button.tile")],dock=[...document.querySelectorAll(".dk")],a=document.activeElement;
  const inRow=tiles.includes(a),inDock=dock.includes(a);
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
    const g=inDock?dock:tiles,i=g.indexOf(a),d=e.key==="ArrowRight"?1:-1;
    (g[i<0?0:Math.min(g.length-1,Math.max(0,i+d))]).focus();e.preventDefault();
  }else if(e.key==="ArrowDown"&&!inDock){dock[1].focus();e.preventDefault()}
  else if(e.key==="ArrowUp"&&inDock){(tiles[0]||a).focus();e.preventDefault()}
});
(row.querySelector("button.tile")||{focus(){}}).focus({preventScroll:true});

function tick(){$("#clock").textContent=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
tick();setInterval(tick,1000);
</script>
</body>
</html>
