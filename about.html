<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>About | Khalil Blount</title>
<style>
:root{--bg:#1c1d21;--bg2:#26272c;--tile:#2f3036;--ink:#f2f3f5;--mute:#9a9ca5;--accent:#e60012;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg));color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,sans-serif;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
a{color:inherit}
.back{display:inline-block;background:var(--tile);border-radius:999px;padding:10px 18px;font-weight:700;text-decoration:none;transition:background .15s}
.back:hover,.back:focus{background:#fff;color:#1c1d21;outline:none}
.card{max-width:640px;margin:40px auto;background:#2b2c32;border-radius:22px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#e60012,#ff8a5c);display:grid;place-items:center;font-weight:800;font-size:1.4rem;border:3px solid #fff;flex:none}
h1{margin:0;font-size:1.6rem}
p{line-height:1.6;color:#d7d8dd}
.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.links a{background:var(--tile);border-radius:999px;padding:10px 18px;font-weight:700;text-decoration:none;transition:background .15s}
.links a:hover,.links a:focus{background:#fff;color:#1c1d21;outline:none}
</style>
</head>
<body>
<a class="back" href="index.html">Back to home</a>
<main class="card">
  <div class="head">
    <div class="avatar">KB</div>
    <h1>Khalil Blount</h1>
  </div>
  <p>Write a short introduction about yourself here: what you do, what you care about, and the kind of work you want to take on.</p>
  <p>Add a second paragraph if you want, such as your background, tools, or how people can work with you.</p>
  <div class="links">
    <a href="https://www.instagram.com/blountcreativeco/" target="_blank" rel="noopener">Instagram</a>
    <a href="https://www.linkedin.com/in/khalil-blount/" target="_blank" rel="noopener">LinkedIn</a>
  </div>
</main>
</body>
</html>
